<style>

  --s:min(14vh,72px);

  --l:calc(10px + env(safe-area-inset-left,0px));
  --r:calc(10px + env(safe-area-inset-right,0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);overflow:hidden;font-family:var(--font-pixel);-webkit-user-select:none;user-select:none;touch-action:none}
#app{position:fixed;inset:0;display:grid;place-items:center;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#cv{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;box-shadow:0 0 0 2px #1a1a44,0 10px 40px rgba(0,0,0,.6)}
#touch{position:fixed;inset:0;pointer-events:none}
#touch[hidden]{display:none}
.tb{position:absolute;pointer-events:auto;width:var(--s);height:var(--s);border-radius:50%;border:2px solid var(--btn-line);background:var(--btn);
  color:#fff;font:700 calc(var(--s)*0.3)/1 var(--font-pixel);display:grid;place-items:center;touch-action:none;-webkit-tap-highlight-color:transparent;padding:0}
.tb.on{background:var(--btn-on);border-color:#ffdd00}
.tb.sm{font-size:calc(var(--s)*0.18)}
#tL{left:var(--l);bottom:calc(var(--b) + var(--s)*0.9)}
#tR{left:calc(var(--l) + var(--s)*1.8);bottom:calc(var(--b) + var(--s)*0.9)}
#tU{left:calc(var(--l) + var(--s)*0.9);bottom:calc(var(--b) + var(--s)*1.8)}
#tD{left:calc(var(--l) + var(--s)*0.9);bottom:var(--b)}
#tJ{right:var(--r);bottom:var(--b);width:calc(var(--s)*1.2);height:calc(var(--s)*1.2)}
#tG{right:calc(var(--r) + var(--s)*1.35);bottom:var(--b)}
#tZ{right:calc(var(--r) + var(--s)*0.1);bottom:calc(var(--b) + var(--s)*1.35)}
#tP{right:calc(10px + env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));width:46px;height:46px;border-radius:12px;font-size:13px}

</style>
</head>

  const t=[...Array(H)].map(()=>Array(W).fill(' ')); const e=[];
  const B={ fill(x0,x1,y0,y1,c='#'){ for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++) if(x>=0&&x<W&&y>=0&&y<H) t[y][x]=c; },

}; }

function audio(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended') AC.resume(); }
function tone(f1,f2,dur,type='square',vol=0.08,delay=0){
  if(!AC||muted) return; const t0=AC.currentTime+delay, o=AC.createOscillator(), v=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f1,t0); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
  v.gain.setValueAtTime(vol,t0); v.gain.exponentialRampToValueAtTime(0.0001,t0+dur); o.connect(v).connect(AC.destination); o.start(t0); o.stop(t0+dur+0.02);
}

function noteFreq(n){ const m=/^([A-G])([#b]?)(\d)$/.exec(n); if(!m) return 0; let i=NOTE_I[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0); const midi=12*(+m[3]+1)+i; return 440*Math.pow(2,(midi-69)/12); }
function parseSeq(str){ const out=[]; let pos=0; for(const tok of str.split(/[\s|]+/)){ if(!tok) continue; const [n,l]=tok.split(':'); const len=+l||2; out.push({f:n==='R'?0:noteFreq(n),at:pos,len}); pos+=len; } return {notes:out,len:pos}; }
for(const k in TUNES){ const tn=TUNES[k]; tn.L=parseSeq(tn.lead); tn.B=parseSeq(tn.bass); }

function musicNode(){ if(!music.gain&&AC){ music.gain=AC.createGain(); music.gain.gain.value=0.5; music.gain.connect(AC.destination); } return music.gain; }
function playNote(f,t0,dur,type,vol){
  if(!f) return; const o=AC.createOscillator(), v=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t0);

}
function scheduleMusic(){
  const tn=TUNES[music.name]; if(!tn||!AC) return;
  const sixteenth=60/tn.bpm/4, loopDur=tn.L.len*sixteenth;
  while(music.next<AC.currentTime+0.25){
    const loopStart=music.next;
    for(const n of tn.L.notes){ const t0=loopStart+n.at*sixteenth, d=n.len*sixteenth*0.92; playNote(n.f,t0,d,tn.wave||'square',0.045); if(tn.echo) playNote(n.f,t0+sixteenth*1.5,d,'triangle',0.018); }
    for(const n of tn.B.notes){ playNote(n.f,loopStart+n.at*sixteenth,n.len*sixteenth*0.8,'triangle',0.09); }
    if(tn.stomp) for(let b=0;b<tn.L.len;b+=4) playNote(55,loopStart+b*sixteenth,sixteenth*0.9,'square',0.03);

function setMusic(name){

}

/* ---------------- tiles and collision ---------------- */
const tileAt=(tx,ty)=>(tx<0||tx>=LV.W||ty<0||ty>=LV.H)?' ':LV.t[ty][tx];
const isDoor=c=>c==='1'||c==='2'||c==='3'||c==='4';
function solidAt(tx,ty){ if(tx<0||tx>=LV.W) return true; if(ty<0||ty>=LV.H) return false; const c=LV.t[ty][tx]; return c==='#'||c==='I'||isDoor(c); }
function moveEntity(e){
  e.hitWall=0;
  e.x+=e.vx;
  const top=Math.floor(e.y/T), bot=Math.floor((e.y+e.h-1)/T);
  if(e.vx>0){ const tx=Math.floor((e.x+e.w-1)/T); for(let ty=top;ty<=bot;ty++) if(solidAt(tx,ty)){ e.x=tx*T-e.w; e.vx=0; e.hitWall=1; break; } }
  else if(e.vx<0){ const tx=Math.floor(e.x/T); for(let ty=top;ty<=bot;ty++) if(solidAt(tx,ty)){ e.x=(tx+1)*T; e.vx=0; e.hitWall=-1; break; } }
  const prevBottom=e.y+e.h;
  e.y+=e.vy; e.ground=false; e.landTile=null;
  const l=Math.floor(e.x/T), r=Math.floor((e.x+e.w-1)/T);
  if(e.vy>0){ const ty=Math.floor((e.y+e.h-0.001)/T);
    for(let tx=l;tx<=r;tx++){ const c=tileAt(tx,ty); const oneway=c==='='&&prevBottom<=ty*T+0.5;
      if(solidAt(tx,ty)||oneway){ e.y=ty*T-e.h; e.vy=0; e.ground=true; e.landTile=c; break; } } }
  else if(e.vy<0){ const ty=Math.floor(e.y/T); for(let tx=l;tx<=r;tx++) if(solidAt(tx,ty)){ e.y=(ty+1)*T; e.vy=0; e.hitCeil=true; break; } }
}
const overlap=(a,b,inset=0)=>a.x+inset<b.x+b.w&&a.x+a.w-inset>b.x&&a.y+inset<b.y+b.h&&a.y+a.h-inset>b.y;
function groundAhead(e){ const tx=Math.floor((e.x+(e.dir>0?e.w+1:-1))/T), ty=Math.floor((e.y+e.h+2)/T); const c=tileAt(tx,ty); return (solidAt(tx,ty)||c==='=')&&tileAt(tx,ty-1)!=='Z'; }
function openDoor(c){
  for(let ty=0;ty<LV.H;ty++) for(let tx=0;tx<LV.W;tx++) if(LV.t[ty][tx]===c){ LV.t[ty][tx]=' '; burst(tx*T+8,ty*T+8,6,GEMC[c],1.6,26); }
  sfx('door'); float(P.x+5,P.y-6,'DOOR OPEN!','#FFFFFF');
}

}
function setPogo(on){
  if(on===P.pogo||P.dead) return;
  if(on){
    const ty=Math.floor((P.y-4)/T), l=Math.floor(P.x/T), r=Math.floor((P.x+P.w-1)/T);
    for(let tx=l;tx<=r;tx++) if(solidAt(tx,ty)){ sfx('click'); return; }

}
function fire(){
  if(P.dead||P.zapCD>0) return;
  if(ammo<=0){ sfx('click'); if(!texts.some(f=>f.txt==='NO ZAPS!')) float(P.x+5,P.y-8,'NO ZAPS!','#FF5555'); return; }
  ammo--; P.zapCD=12; sfx('zap');
  shots.push({x:P.face>0?P.x+P.w-2:P.x-6,y:P.y+(P.pogo?9:7),w:8,h:3,vx:P.face*5.5,vy:0,mine:true,life:70});
}
function updPlayer(){
  if(P.dead>0){
    P.dead++; if(!P.hidden){ P.vy=Math.min(P.vy+0.22,6); P.y+=P.vy; P.x+=P.vx; }
    if(P.dead>110) afterDeath(); return;
  }
  if(hit.has('pogo')) setPogo(!P.pogo);
  if(hit.has('zap')) fire();
  if(jumpHit()) P.jbuf=6; else if(P.jbuf>0) P.jbuf--;
  if(P.inv>0) P.inv--; if(P.zapCD>0) P.zapCD--;
  const dir=(down.right?1:0)-(down.left?1:0);
  const icy=P.ground&&P.landTile==='I';
  if(dir){ P.vx+=dir*ACC*(P.ground?(icy?0.4:1):(P.pogo?0.55:0.75)); P.face=dir; }
  else { const f=P.ground?(icy?0.03:0.35):0.05; P.vx=Math.abs(P.vx)<=f?0:P.vx-Math.sign(P.vx)*f; }
  P.vx=clamp(P.vx,-MAXRUN,MAXRUN);
  if(!P.pogo){
    if(P.ground) P.coyote=6; else if(P.coyote>0) P.coyote--;
    if(P.jbuf>0&&P.coyote>0){ P.vy=JUMP; P.jbuf=0; P.coyote=0; P.ground=false; P.ride=null; sfx('jump'); }
    if(!jumpHeld()&&P.vy<-2.3&&!P.boing) P.vy=-2.3;
  }
  P.vy=Math.min(P.vy+GRAV,MAXFALL);
  if(P.vy>=0) P.boing=false;
  if(P.ride){ P.x+=P.ride.dx; P.y+=P.ride.dy; }
  const wasRide=P.ride; P.ride=null;
  P.hitCeil=false;
  moveEntity(P);
  // moving platforms
  if(P.vy>=0) for(const l of ents){ if(!l.lift) continue;
    if(P.x+P.w>l.x+1&&P.x<l.x+l.w-1&&P.y+P.h>=l.y-3&&P.y+P.h<=l.y+Math.max(7,P.vy+4)){ P.y=l.y-P.h; P.vy=0; P.ground=true; P.ride=l; P.landTile='='; break; } }
  if(P.ground&&P.pogo){ const hi=jumpHeld(); P.vy=hi?POGO_HI:POGO_LO; P.boing=true; P.ground=false; P.ride=null; sfx(hi?'pogoHi':'pogo'); }
  if(P.ground) P.coyote=6;
  // gem doors open when you walk into them holding the matching gem
  { const ty0=Math.floor(P.y/T), ty1=Math.floor((P.y+P.h-1)/T);
    for(const tx of [Math.floor((P.x-2)/T),Math.floor((P.x+P.w+1)/T)]) for(let ty=ty0;ty<=ty1;ty++){ const c=tileAt(tx,ty); if(isDoor(c)&&keys[c]) openDoor(c); } }
  // hazards
  const l=Math.floor((P.x+2)/T), r=Math.floor((P.x+P.w-3)/T), tp=Math.floor((P.y+4)/T), bt=Math.floor((P.y+P.h-1)/T);
  for(let ty=tp;ty<=bt;ty++) for(let tx=l;tx<=r;tx++){
    const c=tileAt(tx,ty);
    if(c==='~'&&P.y+P.h>ty*T+4){ die('goo'); return; }
    if(c==='^'&&P.y+P.h>ty*T+7) hurt();
    if(c==='Z'&&P.y+P.h>ty*T+5) hurt();
  }
  if(P.y>LV.H*T+24){ die('goo'); return; }
  P.anim+=Math.abs(P.vx)>0.2&&P.ground?Math.abs(P.vx)*0.08:0;
  void wasRide;
}
function afterDeath(){

  enterMap();
}

/* ---------------- entities ---------------- */
const KILLPTS={gloop:100,hopper:200,buzz:200,spitter:300,guard:800,king:5000};
const KILLCOL={gloop:['#55FF55','#FFFFFF'],hopper:['#FF55FF','#FFFFFF'],buzz:['#FFFF55','#BFF6FF'],spitter:['#FF55FF','#AA00AA','#55FF55'],guard:['#AA00AA','#FF55FF','#FFFFFF'],king:['#55FF55','#FFFF55','#FFFFFF','#00AA00']};
function damage(e,n,how){
  if(!e.alive) return;
  if(e.robo){ e.stun=160; e.flash=8; sfx('stun'); return; }
  if(e.type==='king'&&how==='stomp'){ if(e.inv>0) return; e.inv=24; }

}

}
function kingDefeated(e){
  sfx('boom'); shake=20; boss=null;
  pending.push({type:'part',kind:'thruster',alive:true,item:true,w:16,h:16,x:e.x+e.w/2-8,y:e.y+e.h-28,by:e.y+e.h-28,t:0});

  for(const x of ents) if(x.enemy&&x.alive&&x!==e){ x.alive=false; burst(x.x+x.w/2,x.y+x.h/2,10,['#FFFFFF']); }

function enemyShot(x,y,vx,vy,g,big){ shots.push({x:x-(big?4:3),y:y-(big?4:3),w:big?9:6,h:big?9:6,vx,vy,g,life:220,big}); }
function stompBounce(){ P.vy=P.pogo?(jumpHeld()?POGO_HI:-5.6):(jumpHeld()?-7:-4.6); P.boing=true; P.ground=false; }
function updEnts(){
  for(const e of ents){
    if(!e.alive) continue; e.t++; if(e.flash>0) e.flash--;
    switch(e.type){
      case 'lift': { const ox=e.x, oy=e.y; if(e.dwell>0) e.dwell--; else { e.p+=e.spd*e.pd; if(e.p>=1){ e.p=1; e.pd=-1; e.dwell=50; } if(e.p<=0){ e.p=0; e.pd=1; e.dwell=50; } } e.x=e.ax+(e.bx-e.ax)*e.p; e.y=e.ay+(e.by-e.ay)*e.p; e.dx=e.x-ox; e.dy=e.y-oy; continue; }
      case 'gloop': e.vx=e.dir*0.45; e.vy=Math.min(e.vy+GRAV,6); moveEntity(e); if(e.hitWall||(e.ground&&!groundAhead(e))) e.dir*=-1; break;
      case 'hopper': e.vy=Math.min(e.vy+GRAV,6);

        moveEntity(e); if(e.hitWall) e.dir*=-1; break;
      case 'buzz': { const px=e.x; e.x=e.x0+Math.sin(e.t*0.018)*42; e.y=e.y0+Math.sin(e.t*0.05)*10; e.dir=e.x>px?1:-1; break; }
      case 'spitter': { const dx=P.x+5-(e.x+6), dy=P.y-e.y; e.dir=dx>0?1:-1; e.cd--;
        if(e.cd<=0&&Math.abs(dx)<190&&Math.abs(dy)<110&&!P.dead){ e.cd=120; e.mouth=14; enemyShot(e.x+6,e.y+3,clamp(dx/55,-2.6,2.6),-3.6,0.15); sfx('spit'); }
        if(e.mouth>0) e.mouth--; break; }

        else { e.vx=e.dir*0.6; e.cd--; const dx=P.x-e.x;
          if(e.cd<=0&&Math.sign(dx)===e.dir&&Math.abs(dx)<170&&Math.abs(P.y+P.h-(e.y+e.h))<30&&!P.dead){ e.cd=130; enemyShot(e.x+(e.dir>0?e.w:0),e.y+6,e.dir*3,0,0); sfx('zap'); } }
        moveEntity(e); if(e.stun<=0&&(e.hitWall||(e.ground&&!groundAhead(e)))) e.dir*=-1; break;
      case 'guard': { e.vy=Math.min(e.vy+GRAV,6); const dx=P.x+5-(e.x+9);
        const chase=!P.dead&&Math.abs(dx)<130&&Math.abs(P.y+P.h-(e.y+e.h))<40;
        if(chase) e.dir=dx>0?1:-1;

      if(e.robo){ if(fromAbove){ stompBounce(); sfx('pogo'); } else { P.vx=(P.x+5<e.x+8?-1:1)*3.2; P.vy=Math.min(P.vy,-2); if(!e.pushT||e.t-e.pushT>20){ sfx('push'); e.pushT=e.t; } } }
      else if(e.stomp&&fromAbove){ kill(e,'stomp'); stompBounce(); }
      else if(e.type==='guard'&&fromAbove){ stompBounce(); if(P.pogo) damage(e,1,'stomp'); else sfx('pogo'); }
      else if(e.type==='king'&&fromAbove){ stompBounce(); damage(e,1,'stomp'); }
      else hurt();
    } else if(e.item&&overlap(P,e)){
      e.alive=false;
      switch(e.type){
        case 'lolly': case 'soda': case 'cake': case 'toy': addScore(PTS[e.type],e.x+6,e.y); sfx('candy'); burst(e.x+6,e.y+6,6,['#FFFFFF','#FFFF55'],1.2,20); break;
        case 'ammo': ammo+=5; sfx('ammo'); float(e.x+5,e.y,'+5 ZAPS','#55FF55'); break;
        case 'heart': if(P.hearts<4) P.hearts++; addScore(100); sfx('heart'); float(e.x+7,e.y,'+1','#FF5555'); break;
        case 'bone': lives++; sfx('oneup'); float(e.x+8,e.y,'1 UP!','#55FF55'); burst(e.x+8,e.y+4,14,['#FFFF55','#FFFFFF'],2); break;
        case 'gem': keys[e.color]=true; addScore(500,e.x+6,e.y); sfx('gem'); burst(e.x+6,e.y+6,14,GEMC[e.color].concat(['#FFFFFF']),2); break;
        case 'part': partGot=true; addScore(2000); sfx('part'); burst(e.x+8,e.y+8,40,['#FFFF55','#FFFFFF','#55FFFF','#FF55FF'],3,50);
          banner={msg:'YOU FOUND THE '+PART_NAMES[e.kind]+'!',sub:'NOW FIND THE EXIT',until:t+180}; break;
      }
    } else if(e.type==='pup'&&overlap(P,{x:e.x-12,y:e.y-8,w:e.w+24,h:e.h+8})){
      if(!hint||hint.e!==e) sfx('woof');
      hint={e,msg:LEVELS[lvlIndex].msgs[e.msg],until:t+150};
    } else if(e.type==='exit'&&!e.locked&&overlap(P,{x:e.x+6,y:e.y+4,w:e.w-12,h:e.h-4})){

      arenaOn=true; for(let ty=9;ty<=11;ty++) LV.t[ty][e.lock]='#'; sfx('slam'); shake=12;
      if(boss){ boss.dormant=false; boss.act=70; banner={msg:'THE GLOOP KING!',sub:'',until:t+120}; }
    }
  }

  if(arenaOn&&boss&&boss.alive&&ammo<3&&t%240===0&&!ents.some(e=>e.type==='ammo'&&e.alive)){
    const tx=(t/240|0)%2?85:97; pending.push({type:'ammo',alive:true,item:true,w:10,h:12,x:tx*T+3,y:7*T+2,by:7*T+2,t:0}); burst(tx*T+8,7*T+8,10,['#55FF55','#FFFFFF']);

function kingAI(e){
  if(e.dormant) return;

  const dx=P.x+5-(e.x+e.w/2); const angry=e.hp<=e.maxHp/2;
  if(e.ground){
    e.dir=dx>0?1:-1; e.vx=e.dir*(angry?1.0:0.7); e.act--;
    if(e.act<=0&&!P.dead){
      if(Math.random()<0.5){ e.vy=angry?-7.6:-6.8; e.vx=clamp(dx/45,-2.4,2.4); sfx('jump'); }
      else { const s=Math.sign(dx)||1; for(const k of (angry?[-1,0,1,2]:[-1,0,1])) enemyShot(e.x+e.w/2,e.y+8,s*(1.7+k*0.6),-4.2+k*0.5,0.16,true); sfx('spit'); }

}
function updShots(){
  for(const s of shots){

    else if(s.mine){ for(const e of ents) if(e.alive&&e.enemy&&!e.dormant&&overlap(s,e)){ damage(e,1,'zap'); s.dead=true; burst(s.x+4,s.y+1,6,['#FFFF55','#FFFFFF'],1.5,14); break; } }
    else if(!P.dead&&!P.hidden&&overlap(P,s,1)){ hurt(); s.dead=true; }
    if(s.life<=0) s.dead=true;

function updParts(){
  for(const p of parts){ p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.life--; }

function finishLevel(door){

/* ---------------- world map ---------------- */
const MW=36, MHT=24, MAPSTART={x:6*T+8,y:13*T+10};
let MAP=null, mapCanvas=null, mapCamX=0, mapCamY=0, mapHint=null, gateAnim=0;
const MH_={x:MAPSTART.x,y:MAPSTART.y,face:1,anim:0};
const ROCKET={x:4,y:10}, BERNIE={x:3,y:13}, GATE={x:26,y:13};
function buildMap(){
  const m=[...Array(MHT)].map(()=>Array(MW).fill('.'));
  for(let y=0;y<MHT;y++) for(let x=0;x<MW;x++){ if(x===0||y===0||x===MW-1||y===MHT-1) m[y][x]='^'; else if(x>27) m[y][x]='d'; }
  for(let y=1;y<MHT-1;y++) m[y][27]='~';
  for(const [x,y] of [[15,17],[16,17],[15,18],[16,18],[17,18],[14,18],[15,19],[16,19]]) m[y][x]='~';
  const path=(a,b,c,d)=>{ for(let x=Math.min(a,c);x<=Math.max(a,c);x++) m[b][x]=':'; for(let y=Math.min(b,d);y<=Math.max(b,d);y++) m[y][c]=':'; };
  path(5,13,8,13); path(8,13,8,4);
  path(8,13,18,13); path(18,13,18,9);
  path(8,13,8,19); path(8,19,11,19);
  path(18,9,18,4); path(18,4,24,4);
  path(18,13,26,13); path(28,13,31,13);
  m[13][27]='='; m[12][26]='^'; m[14][26]='^'; m[13][26]=game&&game.gate?':':'G';
  for(let y=ROCKET.y;y<ROCKET.y+3;y++) for(let x=ROCKET.x;x<ROCKET.x+2;x++) m[y][x]='R';
  const near=(x,y,r)=>{ for(let j=-r;j<=r;j++) for(let i=-r;i<=r;i++){ const c=(m[y+j]||[])[x+i]; if(c===':'||c==='R'||c==='='||c==='G') return true; } return false; };
  const R=seeded(4242);
  for(let y=1;y<MHT-1;y++) for(let x=1;x<MW-1;x++){
    const c=m[y][x]; if(c!=='.'&&c!=='d') continue; const v=R();
    if(near(x,y,1)||(Math.abs(x-BERNIE.x)<2&&Math.abs(y-BERNIE.y)<2)) { if(v<0.12&&c==='.') m[y][x]=','; continue; }
    if(c==='d'){ if(v<0.22) m[y][x]='^'; else if(v<0.34) m[y][x]='T'; continue; }
    if(v<0.2) m[y][x]='T'; else if(v<0.26) m[y][x]='^'; else if(v<0.36) m[y][x]=',';
  }
  for(const L of LEVELS) m[L.map.y][L.map.x]='N';
  MAP=m; renderMap();
}
function renderMap(){
  mapCanvas=document.createElement('canvas'); mapCanvas.width=MW*T; mapCanvas.height=MHT*T; const x=mapCanvas.getContext('2d');
  const R=seeded(99);
  for(let ty=0;ty<MHT;ty++) for(let tx=0;tx<MW;tx++){
    const c=MAP[ty][tx], px=tx*T, py=ty*T;
    const dark=c==='d'||(tx>27&&c!=='~'&&c!=='=');
    x.fillStyle=dark?'#005500':'#00AA00'; x.fillRect(px,py,T,T);
    x.fillStyle=dark?'#00AA00':'#55FF55'; for(let i=0;i<3;i++) x.fillRect(px+((R()*15)|0),py+((R()*15)|0),1,1);
    if(c===':'||c==='N'||c==='G'){ x.fillStyle='#AA7744'; x.fillRect(px,py,T,T); x.fillStyle='#CC9955'; for(let i=0;i<4;i++) x.fillRect(px+((R()*15)|0),py+((R()*15)|0),2,1); x.fillStyle='#885522'; x.fillRect(px+((R()*14)|0),py+((R()*14)|0),1,1); }
    else if(c==='~'||c==='='){ x.fillStyle='#0000AA'; x.fillRect(px,py,T,T); x.fillStyle='#5555FF'; x.fillRect(px+2,py+4,5,1); x.fillRect(px+9,py+10,5,1); x.fillStyle='#55FFFF'; x.fillRect(px+((R()*12)|0),py+((R()*12)|0),2,1);
      if(c==='='){ x.fillStyle='#000'; x.fillRect(px,py+1,T,14); x.fillStyle='#AA5500'; for(let i=0;i<T;i+=4) x.fillRect(px+i,py+2,3,12); x.fillStyle='#5a2a00'; x.fillRect(px,py+2,T,1); x.fillRect(px,py+13,T,1); } }
    else if(c===','){ for(let i=0;i<3;i++){ x.fillStyle=['#FF5555','#FFFF55','#FFFFFF'][i]; x.fillRect(px+2+((R()*11)|0),py+2+((R()*11)|0),2,2); } }
    else if(c==='T'){ x.fillStyle='#000'; x.fillRect(px+6,py+9,4,7); x.fillStyle='#AA5500'; x.fillRect(px+7,py+10,2,6);
      x.fillStyle='#000'; x.beginPath(); x.arc(px+8,py+7,7,0,7); x.fill(); x.fillStyle=dark?'#003300':'#005500'; x.beginPath(); x.arc(px+8,py+7,6,0,7); x.fill(); x.fillStyle=dark?'#005500':'#00AA00'; x.beginPath(); x.arc(px+6,py+5,3,0,7); x.fill(); }
    else if(c==='^'){ x.fillStyle='#000'; x.beginPath(); x.moveTo(px-1,py+16); x.lineTo(px+8,py); x.lineTo(px+17,py+16); x.fill(); x.fillStyle='#555555'; x.beginPath(); x.moveTo(px+1,py+16); x.lineTo(px+8,py+2); x.lineTo(px+15,py+16); x.fill(); x.fillStyle='#AAAAAA'; x.beginPath(); x.moveTo(px+8,py+2); x.lineTo(px+5,py+8); x.lineTo(px+8,py+7); x.lineTo(px+11,py+8); x.fill(); x.fillStyle='#FFFFFF'; x.fillRect(px+7,py+3,2,2); }
  }
}
const mapBlocked=c=>c==='^'||c==='T'||c==='~'||c==='G'||c==='R'||c===undefined;
function mapSolidPx(px,py){ const c=(MAP[Math.floor(py/T)]||[])[Math.floor(px/T)]; return mapBlocked(c); }
function mapBoxFree(x,y){ return !mapSolidPx(x-5,y-5)&&!mapSolidPx(x+5,y-5)&&!mapSolidPx(x-5,y+2)&&!mapSolidPx(x+5,y+2); }
function nodeUnder(){ const tx=Math.floor(MH_.x/T), ty=Math.floor((MH_.y-2)/T); return LEVELS.findIndex(L=>L.map.x===tx&&L.map.y===ty); }
function gateReady(){ return game.parts.wheel&&game.parts.battery&&game.parts.fuel; }
function enterMap(){
  state='map'; hint=null; shots=[]; LV=null; boss=null;
  if(gateReady()&&!game.gate) gateAnim=100;
  mapCamX=clamp(MH_.x-VW/2,0,MW*T-VW); mapCamY=clamp(MH_.y-PH/2,0,MHT*T-PH);
}
function bernieSays(){
  const n=PART_ORDER.filter(k=>game.parts[k]).length;
  if(n===0) return "Woof! The Gloop gang took four rocket parts. Walk onto a level and press JUMP to go in!";
  if(game.gate&&!game.parts.thruster) return "The castle gate is open! The Gloop King has the thruster, the very last part. Bring lots of zaps!";
  if(!game.done[3]&&n>=1) return "You found "+n+" part"+(n>1?'s':'')+"! Psst... the Robot Factory up north has lots of candy and extra lives.";
  return "You found "+n+" part"+(n>1?'s':'')+"! Keep going! The castle gate opens when you have three.";
}
function updMap(){
  if(hit.has('pause')){ pausedFrom='map'; state='pause'; return; }
  if(gateAnim>0){
    gateAnim--; mapCamX+=(clamp(GATE.x*T+8-VW/2,0,MW*T-VW)-mapCamX)*0.08; mapCamY+=(clamp(GATE.y*T-PH/2,0,MHT*T-PH)-mapCamY)*0.08;
    if(gateAnim===50){ MAP[GATE.y][GATE.x]=':'; game.gate=true; saveGame(); renderMap(); sfx('gate'); shake=10; burst(GATE.x*T+8,GATE.y*T+8,30,['#FF5555','#AAAAAA','#FFFFFF'],2.5,40); }
    updParts(); return;
  }
  const dx=(down.right?1:0)-(down.left?1:0), dy=(down.down?1:0)-(down.up?1:0);
  const sp=1.35*(dx&&dy?0.72:1);
  if(dx){ const nx=MH_.x+dx*sp; if(mapBoxFree(nx,MH_.y)) MH_.x=nx; MH_.face=dx; }
  if(dy){ const ny=MH_.y+dy*sp; if(mapBoxFree(MH_.x,ny)) MH_.y=ny; }
  if(dx||dy) MH_.anim+=0.12;
  const n=nodeUnder();
  if(n>=0&&(hit.has('jump')||hit.has('start')||hit.has('tap'))){ game.mx=MH_.x; game.my=MH_.y; sfx('exit'); loadLevel(n); return; }
  const bx=BERNIE.x*T+8, by=BERNIE.y*T+8;
  if(Math.abs(MH_.x-bx)<22&&Math.abs(MH_.y-by)<22){ if(!mapHint) sfx('woof'); mapHint=bernieSays(); } else mapHint=null;
  mapCamX+=(clamp(MH_.x-VW/2,0,MW*T-VW)-mapCamX)*0.15; mapCamY+=(clamp(MH_.y-PH/2,0,MHT*T-PH)-mapCamY)*0.15;
  updParts();
}

/* ---------------- step ---------------- */
function step(){
  t++;
  if(hit.has('mute')) cycleSound();
  if(state==='title'){
    const items=titleItems();
    if(hit.has('left')||hit.has('right')){ heroKey=heroKey==='kellan'?'diana':'kellan'; K=HEROES[heroKey].frames; saveData.hero=heroKey; persist(); sfx('candy'); }
    if(hit.has('up')||hit.has('down')){ menuSel=(menuSel+1)%items.length; sfx('menu'); }
    if(hit.has('zap')||hit.has('pogo')){ heroKey=heroKey==='kellan'?'diana':'kellan'; K=HEROES[heroKey].frames; saveData.hero=heroKey; persist(); sfx('candy'); }
    else if(confirmHit()){
      menuSel=Math.min(menuSel,items.length-1);
      if(items[menuSel]==='CONTINUE'){ loadGame(); enterMap(); }
      else { game=freshGame(); score=0; lives=3; ammo=5; nextLife=20000; MH_.x=MAPSTART.x; MH_.y=MAPSTART.y; buildMap(); saveGame(); state='story'; endT=0; }
    }
  } else if(state==='story'){
    endT++; if(endT>30&&confirmHit()) enterMap();
  } else if(state==='map'){
    updMap();
  } else if(state==='play'){
    if(hit.has('pause')){ pausedFrom='play'; state='pause'; }
    else { updPlayer(); if(state==='play'){ updEnts(); updShots(); } updParts(); updCam(); if(shake>0) shake--; if(banner&&t>banner.until) banner=null; }
  } else if(state==='pause'){
    if(hit.has('pause')||confirmHit()) state=pausedFrom;
  } else if(state==='levelEnd'){
    endT++; updParts(); updEnts(); updCam(); if(shake>0) shake--;
    if(endT>100&&confirmHit()) completeLevel();
  } else if(state==='gameover'){
    endT++;
    if(endT>60&&confirmHit()){ game.lives=3; game.ammo=5; saveData.game=game; persist(); state='title'; menuSel=0; }
  } else if(state==='ending'){
    endT++; updParts();
    if(endT%30===0&&endT>200){ burst(rnd(40,VW-40),rnd(20,90),26,['#FF5555','#FFFF55','#55FFFF','#FF55FF','#55FF55','#FFFFFF'],2.6,60); tone(rnd(600,1200),0,0.05,'triangle',0.04); }
    if(endT===200) sfx('win');
    if(endT>420&&confirmHit()){ state='title'; menuSel=0; }
  }
  if(shake>0&&state==='map') shake--;
  if(AC&&!document.hidden) setMusic(wantedTune());
  hit.clear();
}
function titleItems(){ return saveData.game&&!saveData.game.won?['CONTINUE','NEW GAME']:['NEW GAME']; }

/* ---------------- drawing ---------------- */
const STARS=Array.from({length:110},()=>({x:Math.random()*640,y:Math.random()*PH,c:Math.random()<0.2?'#55FFFF':Math.random()<0.4?'#AAAAAA':'#FFFFFF',tw:Math.random()*6}));
const HILL1=Array.from({length:1024},(_,i)=>34+Math.sin(i/37)*14+Math.sin(i/13)*5+Math.sin(i/97)*10);
const HILL2=Array.from({length:1024},(_,i)=>16+Math.sin(i/23+1)*7+Math.sin(i/7)*2+Math.sin(i/61)*6);
function circle(x,y,r){ g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill(); }
function tri(x1,y1,x2,y2,x3,y3){ g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.lineTo(x3,y3); g.closePath(); g.fill(); }
function rect(c,x,y,w,h){ g.fillStyle=c; g.fillRect(x|0,y|0,w,h); }
function drawBG(th){

  for(const s of STARS){ const x=((s.x-camX*0.08)%640+640)%640; if(x>VW) continue; const y=s.y-camY*0.05; if((t/20+s.tw|0)%7===0&&s.c!=='#AAAAAA') continue; g.fillStyle=s.c; g.fillRect(x|0,y|0,1,1); }

/* ---------------- sizing and loop ---------------- */
function resize(){
  const app=document.getElementById('app'), r=app.getBoundingClientRect();
  const aspect=r.width/Math.max(1,r.height);
  VW=clamp(Math.round(VH*aspect/2)*2,320,448);
  lo.width=VW; lo.height=VH; g=lo.getContext('2d'); g.imageSmoothingEnabled=false;
  let cw=r.width, ch=cw*VH/VW; if(ch>r.height){ ch=r.height; cw=ch*VW/VH; }
  cv.style.width=cw+'px'; cv.style.height=ch+'px';
  document.documentElement.style.setProperty('--hud',(innerHeight-(r.top+(r.height+ch)/2)+ch*(VH-PH)/VH)+'px');
  const dpr=Math.min(3,window.devicePixelRatio||1); cv.width=Math.round(cw*dpr); cv.height=Math.round(ch*dpr); SC=cv.height/VH;
  if(LV){ camX=clamp(camX,0,Math.max(0,LV.W*T-VW)); }
}
addEventListener('resize',resize); resize();
if(document.fonts&&document.fonts.load) document.fonts.load('8px "Press Start 2P"').catch(()=>{});
let acc=0, last=performance.now();
function frame(now){
  acc+=Math.min(100,now-last); last=now;
  if(window.__KKmanual) acc=0; else while(acc>=1000/60){ step(); acc-=1000/60; }
  draw(); requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ if(state==='play'||state==='map'){ pausedFrom=state; state='pause'; } setMusic(null); } });
// test hook for automated play-testing (harmless in normal play)
window.__KK={get state(){return state;}, set state(v){state=v;}, P, get ents(){return ents;}, get LV(){return LV;}, LEVELS, loadLevel:i=>{ if(!game){ game=freshGame(); buildMap(); } loadLevel(i); }, enterMap:()=>{ if(!game){ game=freshGame(); buildMap(); } enterMap(); }, get game(){return game;}, keys:()=>keys, step, draw, MH_, setCam:(x,y)=>{camX=x;camY=y;}, get score(){return score;}, get lives(){return lives;}, get ammo(){return ammo;}, get boss(){return boss;}, down, hit, setKeys:k=>{keys=k;}, get partGot(){return partGot;}, setLives:n=>{lives=n;}, setAmmo:n=>{ammo=n;}};
requestAnimationFrame(frame);
})();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))
